<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Disaster Response</title>
    <link rel="stylesheet" href="../CSS/register.css">
    <style>
        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        AI-Disaster-Response
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="register-page">
    <div class="register-card">
        <h1>Create Account</h1>
        <p class="subtitle">
            Join the AI Disaster Response System
        </p>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" required>
                    <option value="">Select Account Type</option>
                    <option value="CITIZEN">Citizen</option>
                    <option value="AUTHORITY">Authority</option>
                </select>
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <p id="message"></p>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
        // పేజీ రీఫ్రెష్ అవ్వకుండా ఆపుతుంది
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const role = document.getElementById("role").value;

        // 1. పాస్‌వర్డ్స్ మ్యాచ్ అవుతున్నాయో లేదో చెక్ చేస్తుంది
        if (password !== confirmPassword) {
            message.style.color = "#dc2626";
            message.textContent = "Passwords do not match! Please check.";
            return;
        }

        // 2. రోల్ సెలెక్ట్ చేశారా లేదా
        if (!role) {
            message.style.color = "#dc2626";
            message.textContent = "Please select an Account Type (Citizen or Authority).";
            return;
        }

        message.style.color = "#16a34a";
        message.textContent = "Account created! Opening " + role.toLowerCase() + " dashboard...";

        // 3. డాష్‌బోర్డ్‌కి రీడైరెక్ట్
        setTimeout(function () {
            if (role === "CITIZEN") {
                // citizen-dashboard.html కి వెళ్తుంది
                window.location.href = "citizen-dashboard.html";
            } else if (role === "AUTHORITY") {
                // authority-dashboard.html కి వెళ్తుంది
                window.location.href = "authority-dashboard.html";
            }
        }, 800);
    });
});
</script>

</body>
</html>
